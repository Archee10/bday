<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typewriter Message</title>
    <link rel="prefetch" href="envelopes.html">
    <link rel="preload" href="finaltypewriter.mp4" as="video" type="video/mp4">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background-color: #000;
            pointer-events: none;
        }

        /* Hide Safari's native play overlay on iOS */
        video::-webkit-media-controls,
        video::-webkit-media-controls-enclosure,
        video::-webkit-media-controls-panel,
        video::-webkit-media-controls-play-button,
        video::-webkit-media-controls-start-playback-button {
            display: none !important;
            -webkit-appearance: none;
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
            z-index: 100;
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            opacity: 0;
            visibility: hidden;
        }

        .back-btn.show {
            opacity: 1;
            visibility: visible;
            animation: btnFade 0.5s ease forwards;
        }

        @keyframes btnFade {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        .back-btn svg {
            width: 22px;
            height: 22px;
            margin-right: 2px;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.6);
            transform: scale(1.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
            color: #fff;
        }

        .back-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <video id="typeVideo" src="finaltypewriter.mp4" autoplay playsinline webkit-playsinline muted></video>
    <a href="envelopes.html" class="back-btn" id="backBtn" aria-label="Go Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 18l-6-6 6-6"/>
        </svg>
    </a>

    <script>
        const video = document.getElementById('typeVideo');
        const backBtn = document.getElementById('backBtn');

        function tryPlay() {
            video.play().catch(() => {});
        }

        // Attempt autoplay immediately
        tryPlay();

        // iOS Safari fallback: play on first touch
        document.addEventListener('touchstart', tryPlay, { once: true, passive: true });
        document.addEventListener('click', tryPlay, { once: true });

        // Show back button when video ends
        video.addEventListener('ended', () => {
            backBtn.classList.add('show');
        });

        // Safety timeout to show button if video fails to trigger 'ended'
        setTimeout(() => {
            backBtn.classList.add('show');
        }, 8500);
    </script>
</body>
</html>
