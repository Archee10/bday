<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video</title>
  <style>
    /* Smooth page fade-in */
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      animation: fadeIn 1.5s ease-in-out;
      cursor: pointer; /* Indicate the page can be clicked to go back */
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none; /* Prevent interaction that might show controls */
    }

    /* Hide Safari's native play overlay on iOS */
    video::-webkit-media-controls,
    video::-webkit-media-controls-enclosure,
    video::-webkit-media-controls-panel,
    video::-webkit-media-controls-play-button,
    video::-webkit-media-controls-start-playback-button {
      display: none !important;
      -webkit-appearance: none;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Back Button */
    .back-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      width: 44px;
      height: 44px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.3s ease;
      z-index: 100;
      color: rgba(255, 255, 255, 0.9);
      text-decoration: none;
      opacity: 0;
      animation: btnFade 0.5s ease forwards 0.4s;
    }

    @keyframes btnFade {
      from { opacity: 0; transform: scale(0.8); }
      to   { opacity: 1; transform: scale(1); }
    }

    .back-btn svg {
      width: 22px;
      height: 22px;
      margin-right: 2px;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.25);
      border-color: rgba(255, 255, 255, 0.6);
      transform: scale(1.08);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
      color: #fff;
    }

    .back-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>

<body>
  <video id="downloadVideo" src="download.mp4" autoplay playsinline webkit-playsinline loop muted preload="auto"></video>

  <a href="collage_play.html" class="back-btn" aria-label="Go Back" id="backBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 18l-6-6 6-6"/>
    </svg>
  </a>

  <script>
    const video = document.getElementById('downloadVideo');

    function tryPlay() {
      video.play().catch(() => {});
    }

    tryPlay();
    document.addEventListener('touchstart', tryPlay, { once: true, passive: true });
    document.addEventListener('click', tryPlay, { once: true });

    // Allow user to click anywhere to go back to the collage
    document.body.addEventListener('click', () => {
      const backBtn = document.getElementById('backBtn');
      if (backBtn && document.activeElement === backBtn) return;
      document.body.style.transition = 'opacity 0.5s ease-in-out';
      document.body.style.opacity = '0';
      setTimeout(() => {
        window.location.href = 'collage_play.html';
      }, 500);
    });
  </script>
</body>

</html>
