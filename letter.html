<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Letter Viewer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
        }

        img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Fade in the image for a smooth look */
            animation: imgFade 1s ease forwards;
        }

        @keyframes imgFade {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
            z-index: 100;
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            opacity: 0;
            animation: btnFade 0.5s ease forwards 0.5s;
        }

        @keyframes btnFade {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        .back-btn svg {
            width: 22px;
            height: 22px;
            margin-right: 2px;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            border-color: rgba(255, 255, 255, 0.6);
            transform: scale(1.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
            color: #fff;
        }

        .back-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <img id="letterImg" src="" alt="Letter">
    <a href="envelopes.html" class="back-btn" aria-label="Go Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 18l-6-6 6-6"/>
        </svg>
    </a>

    <script>
        // Get the image name from the URL query string
        const urlParams = new URLSearchParams(window.location.search);
        const imgName = urlParams.get('img');
        
        if (imgName) {
            document.getElementById('letterImg').src = imgName;
        } else {
            // If no image is specified, go back to envelopes
            window.location.href = 'envelopes.html';
        }
    </script>
</body>
</html>
