<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday - Collage</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    .video-container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 2x2 Grid overlaying the video */
    .hotspots-grid {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      z-index: 10;
    }

    /* Invisible clickable links */
    .hotspot {
      display: block;
      width: 100%;
      height: 100%;
      text-decoration: none;
      /* Optional: subtle flash on tap/hover */
      transition: background-color 0.2s ease;
      -webkit-tap-highlight-color: rgba(255, 255, 255, 0.2);
    }

    .hotspot:active {
      background-color: rgba(255, 255, 255, 0.15);
    }
  </style>
</head>

<body>
  <div class="video-container">
    <video id="collageVideo" src="collage.mp4" autoplay playsinline loop muted></video>

    <!-- Clickable overlays for the 4 images in the collage video -->
    <div class="hotspots-grid">
      <a href="#" class="hotspot" title="Image 1"></a>
      <a href="envelopes.html" class="hotspot" title="Letterbox"></a>
      <a href="#" class="hotspot" title="Image 3"></a>
      <a href="download_play.html" class="hotspot" title="Image 4"></a>
    </div>
  </div>

  <script>
    const video = document.getElementById('collageVideo');

    // Attempt to autoplay the video seamlessly
    video.play().catch(error => {
      console.log("Autoplay prevented. Waiting for a tap to play.");
      // If the browser blocks autoplay, wait for a user tap
      document.body.addEventListener('click', () => {
        video.play();
      }, { once: true });
    });
  </script>
</body>

</html>
