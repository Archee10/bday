<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday - Collage</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>

<body>
  <video id="collageVideo" src="collage.mp4" autoplay playsinline loop muted></video>

  <script>
    const video = document.getElementById('collageVideo');

    // Attempt to autoplay the video seamlessly
    video.play().catch(error => {
      console.log("Autoplay prevented. Waiting for a tap to play.");
      // If the browser blocks autoplay, wait for a user tap
      document.body.addEventListener('click', () => {
        video.play();
      }, { once: true });
    });
  </script>
</body>

</html>
