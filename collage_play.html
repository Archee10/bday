<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Happy Birthday - Collage</title>
  <link rel="prefetch" href="music.html">
  <link rel="prefetch" href="envelopes.html">
  <link rel="prefetch" href="download_play.html">
  <link rel="prefetch" href="download.mp4">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }

    .video-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
    }

    video {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      pointer-events: none;
    }

    /* Hide Safari's native play overlay on iOS */
    video::-webkit-media-controls,
    video::-webkit-media-controls-enclosure,
    video::-webkit-media-controls-panel,
    video::-webkit-media-controls-play-button,
    video::-webkit-media-controls-start-playback-button {
      display: none !important;
      -webkit-appearance: none;
    }

    /* 2x2 Grid overlaying the video */
    .hotspots-grid {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      z-index: 10;
    }

    /* Invisible clickable links */
    .hotspot {
      display: block;
      width: 100%;
      height: 100%;
      text-decoration: none;
      transition: background-color 0.2s ease;
      -webkit-tap-highlight-color: rgba(255, 255, 255, 0.2);
    }

    .hotspot:active {
      background-color: rgba(255, 255, 255, 0.15);
    }
  </style>
</head>

<body>
  <div class="video-container">
    <video id="collageVideo" src="collage.mp4" autoplay playsinline webkit-playsinline loop muted></video>

    <!-- Clickable overlays for the 4 images in the collage video -->
    <div class="hotspots-grid">
      <a href="music.html" class="hotspot" title="Image 1"></a>
      <a href="envelopes.html" class="hotspot" title="Letterbox"></a>
      <a href="#" class="hotspot" title="Image 3"></a>
      <a href="download_play.html" class="hotspot" title="Image 4"></a>
    </div>
  </div>

  <script>
    const video = document.getElementById('collageVideo');

    function tryPlay() {
      video.play().catch(() => {});
    }

    tryPlay();
    document.addEventListener('touchstart', tryPlay, { once: true, passive: true });
    document.addEventListener('click', tryPlay, { once: true });
  </script>
</body>

</html>
