<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zoom Animation</title>
  <link rel="prefetch" href="collage_play.html">
  <link rel="preload" href="collage.mp4" as="video" type="video/mp4">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    /* Hide Safari's native play overlay on iOS */
    video::-webkit-media-controls,
    video::-webkit-media-controls-enclosure,
    video::-webkit-media-controls-panel,
    video::-webkit-media-controls-play-button,
    video::-webkit-media-controls-start-playback-button {
      display: none !important;
      -webkit-appearance: none;
    }
  </style>
</head>

<body>
  <!-- Note: We are specifically leaving out the 'controls' attribute so the player is clean -->
  <video id="zoomVideo" src="zoom.mp4" autoplay playsinline webkit-playsinline muted></video>

  <script>
    const video = document.getElementById('zoomVideo');

    function tryPlay() {
      video.play().catch(() => {});
    }

    tryPlay();
    document.addEventListener('touchstart', tryPlay, { once: true, passive: true });
    document.addEventListener('click', tryPlay, { once: true });

    // Automatically redirect to collage_play.html when the video finishes
    video.addEventListener('ended', () => {
      window.location.href = 'collage_play.html';
    });
  </script>
</body>

</html>
