<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zoom Animation</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .page-transition-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000;
      z-index: 99999;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.8s ease-in-out;
    }

    .page-transition-overlay.active {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div id="pageTransition" class="page-transition-overlay active"></div>
  <!-- Note: We are specifically leaving out the 'controls' attribute so the player is clean -->
  <video id="zoomVideo" src="zoom.mp4" autoplay playsinline></video>

  <script>
    const video = document.getElementById('zoomVideo');

    // Fade in when the page loads
    window.addEventListener('load', () => {
      requestAnimationFrame(() => {
        document.getElementById('pageTransition').classList.remove('active');
      });
    });

    // Attempt to autoplay the video seamlessly
    video.play().catch(error => {
      console.log("Autoplay prevented. Waiting for a tap to play.");
      // If the browser blocks autoplay, wait for a user tap
      document.body.addEventListener('click', () => {
        video.play();
      }, { once: true });
    });

    // Automatically redirect to nb3.jpeg when the video finishes
    video.addEventListener('ended', () => {
      document.getElementById('pageTransition').classList.add('active');
      setTimeout(() => {
        window.location.href = 'nb3.jpeg';
      }, 800);
    });
  </script>
</body>
</html>
