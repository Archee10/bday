<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zoom Animation</title>
  
  <!-- Preload current video for fast starting -->
  <link rel="preload" as="video" href="zoom.mp4">
  
  <!-- Prefetch next step assets for smooth transition -->
  <link rel="prefetch" href="collage_play.html">
  <link rel="prefetch" href="collage.mp4">
  
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>

<body>
  <!-- Note: We are specifically leaving out the 'controls' attribute so the player is clean -->
  <video id="zoomVideo" src="zoom.mp4" autoplay playsinline preload="auto"></video>

  <script>
    const video = document.getElementById('zoomVideo');

    // Attempt to autoplay the video seamlessly
    video.play().catch(error => {
      console.log("Autoplay prevented. Waiting for a tap to play.");
      // If the browser blocks autoplay, wait for a user tap
      document.body.addEventListener('click', () => {
        video.play();
      }, { once: true });
    });

    // Automatically redirect to collage_play.html when the video finishes
    video.addEventListener('ended', () => {
      window.location.href = 'collage_play.html';
    });
  </script>
</body>

</html>
