<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday!</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>

<body>
  <video id="bdayVideo" src="download.mp4" autoplay playsinline></video>

  <script>
    const video = document.getElementById('bdayVideo');

    // Redirect after 8 seconds of playback
    video.addEventListener('timeupdate', () => {
      if (video.currentTime >= 8) {
        window.location.href = 'zoom.html';
      }
    });

    // Attempt to autoplay
    video.play().catch(error => {
      console.log("Autoplay prevented. Waiting for a tap to play.");
      // If autoplay is prevented by the browser, wait for any tap on the screen to play
      document.body.addEventListener('click', () => {
        video.play();
      }, { once: true });
    });
  </script>
</body>

</html>
