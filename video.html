<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday!</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .page-transition-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #000;
      z-index: 99999;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.8s ease-in-out;
    }

    .page-transition-overlay.active {
      opacity: 1;
    }
  </style>
</head>

<body>
  <div id="pageTransition" class="page-transition-overlay active"></div>
  <video id="bdayVideo" src="download.mp4" autoplay playsinline></video>

  <script>
    const video = document.getElementById('bdayVideo');

    // Fade in when the page loads
    window.addEventListener('load', () => {
      requestAnimationFrame(() => {
        document.getElementById('pageTransition').classList.remove('active');
      });
    });

    // Fade out and redirect near the end of playback
    let isFadingOut = false;
    video.addEventListener('timeupdate', () => {
      if (video.currentTime >= 7.2 && !isFadingOut) {
        isFadingOut = true;
        document.getElementById('pageTransition').classList.add('active');
        setTimeout(() => {
          window.location.href = 'zoom.html';
        }, 800);
      }
    });

    // Attempt to autoplay
    video.play().catch(error => {
      console.log("Autoplay prevented. Waiting for a tap to play.");
      // If autoplay is prevented by the browser, wait for any tap on the screen to play
      document.body.addEventListener('click', () => {
        video.play();
      }, { once: true });
    });
  </script>
</body>

</html>
