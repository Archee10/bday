<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Happy Birthday!</title>
  <link rel="prefetch" href="zoom.html">
  <link rel="preload" href="zoom.mp4" as="video" type="video/mp4">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }

    video {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      pointer-events: none;
    }

    /* Hide Safari's native play overlay on iOS */
    video::-webkit-media-controls,
    video::-webkit-media-controls-enclosure,
    video::-webkit-media-controls-panel,
    video::-webkit-media-controls-play-button,
    video::-webkit-media-controls-start-playback-button {
      display: none !important;
      -webkit-appearance: none;
    }
  </style>
</head>

<body>
  <video id="bdayVideo" src="download1.mp4" autoplay playsinline webkit-playsinline muted preload="auto"></video>

  <script>
    const video = document.getElementById('bdayVideo');
    let redirectTimer = null;

    function scheduleRedirect() {
      if (redirectTimer) return;
      const remaining = Math.max(0, 8 - video.currentTime) * 1000;
      redirectTimer = setTimeout(() => {
        window.location.href = 'zoom.html';
      }, remaining);
    }

    function tryPlay() {
      video.play().then(scheduleRedirect).catch(() => {});
    }

    // Attempt autoplay immediately
    tryPlay();

    // iOS Safari fallback: play on first touch (fires before 'click')
    document.addEventListener('touchstart', tryPlay, { once: true, passive: true });
    document.addEventListener('click', tryPlay, { once: true });
  </script>
</body>

</html>
