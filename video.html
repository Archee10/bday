<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday!</title>
  <link rel="prefetch" href="zoom.html">
  <link rel="preload" href="zoom.mp4" as="video" type="video/mp4">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>

<body>
  <video id="bdayVideo" src="download1.mp4" autoplay playsinline muted preload="auto"></video>

  <script>
    const video = document.getElementById('bdayVideo');
    let redirectTimer = null;

    function scheduleRedirect() {
      if (redirectTimer) return;
      const remaining = Math.max(0, 8 - video.currentTime) * 1000;
      redirectTimer = setTimeout(() => {
        window.location.href = 'zoom.html';
      }, remaining);
    }

    // Attempt to autoplay
    video.play().then(scheduleRedirect).catch(error => {
      console.log("Autoplay prevented. Waiting for a tap to play.");
      document.body.addEventListener('click', () => {
        video.play().then(scheduleRedirect);
      }, { once: true });
    });
  </script>
</body>

</html>
